name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查与构建后端
        run: pnpm build

      - name: 单元测试
        run: pnpm test

      - name: 构建前端
        run: pnpm web:build

      - name: 前端类型检查
        run: pnpm check:web

      - name: CLI 冒烟
        run: node dist/cli.js --help
