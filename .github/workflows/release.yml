name: Release

# 自动构建并发布 Release：
#  - 推送 v* 标签：始终构建并发布（用于手动发版/重发）
#  - 推送 main：自动构建；若 package.json 的版本号尚无对应 Release 则自动创建发布
#    （版本号去重—— bump 版本后推送即发版，无需手动打标签）
#  - workflow_dispatch：Actions 页手动触发，仅构建上传产物
# 每个版本均包含 Windows / Linux（x64+arm64）可执行文件。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm 版本由 package.json 的 packageManager 字段唯一决定（此处不能再传 version，会冲突）

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建后端与前端
        run: pnpm build && pnpm web:build

      - name: 单元测试
        run: pnpm test

      - name: 打包多平台可执行文件
        run: node scripts/build-exe.mjs

      - name: 计算版本号与发布条件
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
            PUBLISH=true   # 标签推送：始终发布
          else
            VER=$(node -p "require('./package.json').version")
            TAG="v$VER"
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              PUBLISH=false  # 该版本已发布过：主分支推送只做构建校验，不重复覆盖
            else
              PUBLISH=true   # 新版本：自动发布
            fi
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "版本 $VER（$TAG）→ publish=$PUBLISH"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles-${{ steps.meta.outputs.version }}
          path: build/release/*.tar.gz

      - name: 发布 GitHub Release
        if: steps.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: build/release/*.tar.gz
          generate_release_notes: true
