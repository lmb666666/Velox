name: Release

# 推送 v* 标签时自动构建多平台可执行文件并发布 GitHub Release；
# 也可在 Actions 页面手动触发（仅构建产物，不发 Release）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建后端与前端
        run: pnpm build && pnpm web:build

      - name: 单元测试
        run: pnpm test

      # pkg 在 Linux 上构建 macOS 产物需 ldid 做 ad-hoc 签名，否则 macOS 会拒绝启动
      - name: 安装 macOS 签名工具
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ldid

      - name: 打包多平台可执行文件
        run: node scripts/build-exe.mjs

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: build/release/*.tar.gz

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/*.tar.gz
          generate_release_notes: true
