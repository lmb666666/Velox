<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Velox —— 调用 itdog.cn 全国监测节点的网络测速平台" />
    <title>Velox · 全国监测节点测速平台</title>
    <script>
      // 主题初始化：避免闪屏（跟随系统 + localStorage 覆盖；velox-theme 主键，pulse-theme 为旧品牌遗留兼容读）
      (function () {
        try {
          var t = localStorage.getItem('velox-theme') ?? localStorage.getItem('pulse-theme');
          var dark = t === 'dark' || ((t === null || t === '') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
