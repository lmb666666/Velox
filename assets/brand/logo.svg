<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Velox">
  <!-- Velox 主标志 · 上升折线 × 三节点 · 规格 docs/BRAND.md -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161F"/><stop offset="1" stop-color="#0A0E14"/>
    </linearGradient>
    <linearGradient id="veline" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5C7"/><stop offset="1" stop-color="#7C9FFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00E5C7" stop-opacity="0.35"/><stop offset="1" stop-color="#00E5C7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#tile)" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
  <circle cx="106" cy="26" r="17" fill="url(#glow)"/>
  <polyline points="22,42 44,90 76,50 106,24" fill="none" stroke="url(#veline)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="22" cy="42" r="6" fill="#9AA7B8"/>
  <circle cx="44" cy="90" r="5" fill="#00E5C7" fill-opacity="0.55"/>
  <circle cx="106" cy="24" r="8" fill="#00E5C7"/>
</svg>
