<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="64" height="64">
  <!-- 小尺寸简化版：加粗描边、去光晕与描边框 -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232329"/><stop offset="1" stop-color="#0A0A0C"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#tile)"/>
  <polyline points="26,74 50,74 60,44 70,90 80,58 90,74 102,74" fill="none" stroke="url(#wave)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="26" cy="74" r="7.5" fill="#67E8F9"/>
  <circle cx="102" cy="74" r="9" fill="#22D3EE"/>
</svg>
