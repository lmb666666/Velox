<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="64" height="64">
  <!-- 与 logo.svg 同一几何（唯一差异：描边加粗适配小尺寸） -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161F"/><stop offset="1" stop-color="#0A0E14"/>
    </linearGradient>
    <linearGradient id="rise" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5C7"/><stop offset="1" stop-color="#7C9FFF"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <polyline points="32,32 60,94" fill="none" stroke="#8A94A6" stroke-width="13" stroke-linecap="round"/>
  <polyline points="60,94 106,24" fill="none" stroke="url(#rise)" stroke-width="13" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="8" fill="#B9C2CF"/>
  <circle cx="106" cy="24" r="10" fill="#00E5C7"/>
</svg>
